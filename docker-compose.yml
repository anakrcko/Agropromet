# SQL Server za lokalni razvoj (alternativa za LocalDB).
# Pokretanje:  docker compose up -d
# Lozinka se čita iz fajla .env (vidi .env.example) — ne upisuje se ovde.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agropromet-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Postavite MSSQL_SA_PASSWORD u .env fajlu}"
    ports:
      - "1433:1433"
    volumes:
      - agropromet-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  agropromet-sql:
